# Condition A (REST) — GitHub's official MCP Server over stdio (Docker).
#
# This is a TEMPLATE. run_benchmark.py injects the task prompt (as an indented
# block scalar) into runs/<...>/recipe.yaml before invoking goose. Token / model
# settings are study constants and are hard-coded; GOOSE_MODEL env overrides the
# model if MODEL is set in .env. The runner fills --toolsets via the
# @@GH_TOOLSETS@@ token (A1=all, A2=repos,issues,pull_requests); the PAT is
# supplied via the GITHUB_PERSONAL_ACCESS_TOKEN env var (never written to disk).
# --read-only keeps the agent to read operations. NOTE: this image sets
# ENTRYPOINT=/server/github-mcp-server with Cmd=[stdio]; args are appended to that
# entrypoint, so we pass `stdio --read-only --toolsets ...` WITHOUT a binary name,
# and the comma-separated --toolsets flag is used (the GITHUB_TOOLSETS env var
# did not split commas in this version).
version: "1.0.0"
title: "Benchmark — Condition A (REST via GitHub MCP Server)"
description: "Answer the task using GitHub's official MCP server (REST API underneath), over stdio."
instructions: |
  You are a developer assistant. Answer the user's request using ONLY the GitHub
  MCP tools available to you. Be concise: once you have the answer, state it
  directly as a list. Do not ask follow-up questions.
  (benchmark-run-id: @@RUN_ID@@)
prompt: |
  @@TASK_PROMPT@@
settings:
  goose_provider: anthropic
  goose_model: @@MODEL@@
  temperature: 0
  max_turns: 50
extensions:
  - type: stdio
    name: github
    cmd: docker
    args:
      - run
      - -i
      - --rm
      - -e
      - GITHUB_PERSONAL_ACCESS_TOKEN
      - ghcr.io/github/github-mcp-server
      - stdio
      - --read-only
      - --toolsets
      - "@@GH_TOOLSETS@@"
    env_keys:
      - GITHUB_PERSONAL_ACCESS_TOKEN
    timeout: 300
